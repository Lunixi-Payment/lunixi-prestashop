name: PrestaShop module
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested merchant ZIP to its existing version tag after all checks pass'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  build:
    outputs:
      zip_name: ${{ steps.tested_zip.outputs.zip_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: sodium,curl,json,pdo_mysql,zip,intl,gd,bcmath
          tools: composer:v2
      - run: composer install --working-dir=tools --no-interaction --prefer-dist
      - run: composer audit --working-dir=tools
      - run: php tools/vendor/bin/phpcs --standard=phpcs.xml
      - run: php tools/build.php
      - run: php tools/check-artifact.php
      - name: Identify the exact candidate ZIP from trusted release metadata
        id: tested_zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          metadata = Path('VERSION')
          version = json.loads(metadata.read_text())["version"] if metadata.suffix == ".json" else metadata.read_text().strip()
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A trusted semantic release version is required.")
          import os
          name = 'lunixipay-{version}.zip'.format(version=version)
          if not (Path("dist") / name).is_file():
              raise SystemExit("The versioned merchant ZIP was not built.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("zip_name=" + name + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merchant-zip
          path: dist/${{ steps.tested_zip.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 1
  native:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['8.2.4', '9.2.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: sodium,curl,json,pdo_mysql,zip,intl,gd,bcmath
          tools: composer:v2
      - run: composer install --working-dir=tools --no-interaction --prefer-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merchant-zip
          path: dist
      - name: Install the exact built candidate ZIP
        env:
          TESTED_ZIP: ${{ needs.build.outputs.zip_name }}
        run: mkdir -p build && unzip "dist/$TESTED_ZIP" -d build
      - run: docker compose -f tests/compose.yml up -d
        env:
          PRESTASHOP_IMAGE: prestashop/prestashop:${{ matrix.platform }}
      - name: Wait for complete native installation and Apache readiness
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f tests/compose.yml)
          container="$("${compose[@]}" ps --all --quiet shop)"
          if [ -z "$container" ]; then
            echo '::error::Native shop container was not created.'
            "${compose[@]}" logs --no-color --tail 80 shop
            exit 1
          fi
          for attempt in $(seq 1 90); do
            state="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
            case "$state" in
              exited|dead|removing|'')
                echo "::error::Native shop stopped before successful installation (state=$state)."
                "${compose[@]}" logs --no-color --tail 80 shop
                exit 1
                ;;
            esac
            if "${compose[@]}" exec -T shop sh -c 'test -f app/config/parameters.php && test ! -e install.lock && test ! -d install-lunixi' &&
               "${compose[@]}" exec -T shop php -r '$socket = @stream_socket_client("tcp://127.0.0.1:80", $errno, $error, 2); if (!is_resource($socket)) { exit(1); } stream_set_timeout($socket, 2); fwrite($socket, "GET /index.php HTTP/1.1\r\nHost: localhost:18092\r\nConnection: close\r\n\r\n"); $line = fgets($socket, 512); fclose($socket); exit(is_string($line) && preg_match("~^HTTP/1\\.[01] [23][0-9]{2} ~", $line) ? 0 : 1);'; then
              echo 'Native installer completed and Apache returned a successful HTTP status.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Native installation did not become ready within the bounded wait.'
          "${compose[@]}" logs --no-color --tail 80 shop
          exit 1
      - run: docker compose -f tests/compose.yml exec -T shop php /lunixi-tests/native.php /var/www/html
      - run: docker compose -f tests/compose.yml exec -T shop php /lunixi-tests/reinstall.php /var/www/html
      - name: Restore native web-user ownership of disposable CLI-warmed caches
        run: docker compose -f tests/compose.yml exec -T shop chown -R www-data:www-data /var/www/html/var/cache
      - run: docker compose -f tests/compose.yml exec -T shop php /lunixi-tests/http.php http://localhost localhost:18092
      - run: docker compose -f tests/compose.yml cp tools/vendor/phpstan/phpstan/phpstan.phar shop:/tmp/phpstan.phar
      - run: docker compose -f tests/compose.yml exec -T -e PRESTASHOP_ROOT=/var/www/html shop php /tmp/phpstan.phar analyse -c /lunixi-tests/phpstan-native.neon --no-progress
      - if: always()
        run: docker compose -f tests/compose.yml down --volumes

  release_assets:
    name: Collect the exact ZIP after every native/matrix gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    needs: [build, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merchant-zip
          path: dist
      - name: Prepare only the exact tested ZIP and its checksum
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          metadata = Path('VERSION')
          version = json.loads(metadata.read_text())["version"] if metadata.suffix == ".json" else metadata.read_text().strip()
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A trusted semantic release version is required.")
          import hashlib, shutil, zipfile
          name = 'lunixipay-{version}.zip'.format(version=version)
          source = Path('dist') / name
          if source.is_symlink() or not source.is_file() or not 0 < source.stat().st_size <= 256 * 1024 * 1024:
              raise SystemExit("The exact tested merchant ZIP is missing or invalid.")
          with zipfile.ZipFile(source) as archive:
              if len(archive.infolist()) > 20000 or sum(item.file_size for item in archive.infolist()) > 1024 * 1024 * 1024:
                  raise SystemExit("Merchant archive exceeds the release bound.")
              if archive.testzip() is not None:
                  raise SystemExit("Merchant archive CRC verification failed.")
          output = Path("release-assets")
          output.mkdir()
          shutil.copyfile(source, output / name)
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          (output / "SHA256SUMS").write_text(digest + "  " + name + "\n", encoding="ascii")
          PY
      - name: Store tested native release assets
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-native-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish_release:
    name: Publish the tested merchant ZIP to an existing tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    needs: release_assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-native-release
          path: release-assets
      - name: Validate passive assets against trusted source metadata
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          metadata = Path('VERSION')
          version = json.loads(metadata.read_text())["version"] if metadata.suffix == ".json" else metadata.read_text().strip()
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A trusted semantic release version is required.")
          import hashlib, os, zipfile
          name = 'lunixipay-{version}.zip'.format(version=version)
          folder = Path("release-assets")
          if folder.is_symlink() or {path.name for path in folder.iterdir()} != {name, "SHA256SUMS"}:
              raise SystemExit("Release accepts only the expected ZIP and SHA256SUMS.")
          asset, checksum = folder / name, folder / "SHA256SUMS"
          if asset.is_symlink() or checksum.is_symlink() or not asset.is_file() or not checksum.is_file():
              raise SystemExit("Release assets must be regular files.")
          if not 0 < asset.stat().st_size <= 256 * 1024 * 1024 or checksum.stat().st_size > 1024:
              raise SystemExit("Release assets exceed their configured bound.")
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          if checksum.read_text(encoding="ascii") != digest + "  " + name + "\n":
              raise SystemExit("The tested ZIP checksum does not match.")
          with zipfile.ZipFile(asset) as archive:
              if len(archive.infolist()) > 20000 or sum(item.file_size for item in archive.infolist()) > 1024 * 1024 * 1024 or archive.testzip() is not None:
                  raise SystemExit("Invalid merchant ZIP; artifact contents are never executed.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("version=" + version + "\nzip_name=" + name + "\n")
          notes = "Merchant installation ZIP and SHA256SUMS from the fully passing workflow run.\n\n"
          notes += "Source commit: " + os.environ["GITHUB_SHA"] + "\n"
          notes += "Verification: " + os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "\n\n"
          notes += "Verify SHA256SUMS before installation; follow the repository README and staging/backup instructions. This release does not imply marketplace certification or a live merchant charge.\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Create the release without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
          RELEASE_ZIP: ${{ steps.verify.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          python3 - <<'PY_GATE'
          import json, os, re, subprocess
          repo, version, source = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_VERSION'], os.environ['GITHUB_SHA']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) or not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('Invalid trusted release identity.')
          def api(path):
              result = subprocess.run(['gh', 'api', 'repos/' + repo + '/' + path], check=True, capture_output=True, text=True)
              return json.loads(result.stdout)
          obj = api('git/ref/tags/v' + version)['object']
          for _ in range(4):
              if not re.fullmatch(r'[0-9a-f]{40}', obj['sha']):
                  raise SystemExit('Invalid release tag object.')
              if obj['type'] == 'commit':
                  break
              if obj['type'] != 'tag':
                  raise SystemExit('Release tag does not identify a commit.')
              obj = api('git/tags/' + obj['sha'])['object']
          if obj['type'] != 'commit' or obj['sha'] != source:
              raise SystemExit('Version tag differs from the tested source commit; refusing publication.')
          print('Existing version tag identifies the exact tested source commit.')
          PY_GATE
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$tag" "release-assets/$RELEASE_ZIP" release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lunixi PrestaShop $RELEASE_VERSION" --notes-file release-notes.md
