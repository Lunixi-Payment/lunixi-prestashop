targetRules = ["generic-api-key"]
paths = ['''(?:^|/)tests/compose\.yml$''']
regexTarget = "line"
regexes = ['''\A\s*\QLUNIXI_ENCRYPTION_KEY: dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LTMyLWJ5dGU=\E\s*\z'''] # gitleaks:allow
